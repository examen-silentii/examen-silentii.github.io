title: "Examen Silentii"
subtitle: "Journal of Software and Data Verification"
description: "ExSil: an open journal of independent, reproducible examinations of scientific software and public research data."
url: "https://examen-silentii.github.io"
logo: /assets/img/exsil-mark-512.png
lang: en-GB

# Fill in once the journal has its own address, e.g. "examen.silentii@gmail.com"
